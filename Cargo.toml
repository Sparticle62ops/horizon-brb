[package]
name = "horizon-mod-brb"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Better Recipe Book ported to Horizon (1:1 core: config, instant craft manager, pinned recipe manager). Upstream: github.com/mrshmllow/BetterRecipeBook, MIT (c) 2021 marshamallow."

[lib]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
